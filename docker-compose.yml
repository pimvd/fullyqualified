services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Default: Host=db;Database=fullyqualified;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Auth__Password: ${FQ_PASSWORD:-}
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fullyqualified
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:

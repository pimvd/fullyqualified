name: deploy
# Reusable: terraform apply for one environment, then bind the custom domain.
# image_tag set: both containers use it (dev). Empty: the tags come from infra/envs/<environment>.tfvars (prd).
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    env:
      ENV: ${{ inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_setup_code: ${{ secrets.SETUP_CODE }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Names
        run: |
          sub="${{ vars.AZURE_SUBSCRIPTION_ID }}"
          acr="fqacr${sub//-/}"; echo "ACR_NAME=${acr:0:24}" >> "$GITHUB_ENV"
          st="fqtf${sub//-/}";  echo "STATE_ACCOUNT=${st:0:24}" >> "$GITHUB_ENV"

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=fq-shared-rg" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${ENV}.tfstate"

      - name: Apply
        run: |
          args=(-input=false -auto-approve -var-file="envs/${ENV}.tfvars" -var "acr_name=$ACR_NAME")
          if [ -n "${{ inputs.image_tag }}" ]; then
            args+=(-var "web_image_tag=${{ inputs.image_tag }}" -var "worker_image_tag=${{ inputs.image_tag }}")
          fi
          terraform apply "${args[@]}"

      - name: Bind the domain
        run: |
          app=$(terraform output -raw web_app_name)
          fqdn=$(terraform output -raw web_fqdn)
          verification=$(terraform output -raw domain_verification_id)
          envname=$(terraform output -raw environment_name)
          domain=$(grep -E '^domain' "envs/${ENV}.tfvars" | cut -d'"' -f2)
          rg="fq-${ENV}-rg"

          bound=$(az containerapp hostname list -g "$rg" -n "$app" --query "[?name=='$domain'].bindingType | [0]" -o tsv)
          if [ "$bound" = "SniEnabled" ]; then
            echo "Domain \`$domain\` is bound." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### DNS records for \`$domain\`"
            echo "Create these, then re-run this workflow:"
            echo ""
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| CNAME | \`$domain\` | \`$fqdn\` |"
            echo "| TXT | \`asuid.$domain\` | \`$verification\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! az containerapp hostname add -g "$rg" -n "$app" --hostname "$domain" -o none 2>/dev/null; then
            echo "DNS is not ready yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          az containerapp hostname bind -g "$rg" -n "$app" --hostname "$domain" \
            --environment "$envname" --validation-method CNAME -o none
          echo "Bound \`$domain\` with a managed certificate." >> "$GITHUB_STEP_SUMMARY"

name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FQ_TEST_DB: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          # nullglob: without it an unmatched *.sln stays literal, ls fails, and CI silently skips build and tests
          shopt -s nullglob
          solutions=(*.sln *.slnx)
          if [ ${#solutions[@]} -gt 0 ]; then
            dotnet build --nologo && dotnet test --nologo --no-build
          else
            echo "No solution yet"
          fi

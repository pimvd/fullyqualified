name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          if ls *.sln *.slnx >/dev/null 2>&1; then
            dotnet build --nologo && dotnet test --nologo --no-build
          else
            echo "No solution yet"
          fi

name: deploy-dev
# Every merge to master that changes the app or the infra goes to dev, after CI has passed on the PR.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - "infra/**"
      - ".github/workflows/deploy*.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      domain: dev.fq.vandijkcloud.nl
    secrets:
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      SETUP_CODE: ${{ secrets.SETUP_CODE }}
